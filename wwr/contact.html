<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Cascade Rapids Rafting Co. with questions about trips and bookings.">
    <meta name="author" content="David Christian Kay">
    <title>Contact Us | Cascade Rapids Rafting Co.</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Cascade Rapids Rafting Co. logo" class="logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact">
        <h1>Cascade Rapids Rafting Co.</h1>
        <address>
            123 Rapids Road <br>
            White Water City, Colorado <br>
            <a href="tel:+18005551234">+1 800 555 1234</a> <br>
            <a href="mailto:info@cascaderapids.com">info@cascaderapids.com </a>
        </address>
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d24808.492632495017!2d-108.47402205684233!3d38.991090939057806!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x874716d552bce7c7%3A0xacaea0620de0afa3!2sWhitewater%2C%20CO%2081527!5e0!3m2!1sen!2sus!4v1791498928354!5m2!1sen!2sus"
          title="Map to Cascade Rapids Rafting Co." width="400" height="300" allowfullscreen=""
          loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
        </iframe>

        <form>
            <label for="name">What is your name?</label>
            <input type="text" id="name" name="name" required>

            <label for="email">What is your email address?</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">What is your phone number?</label>
            <input type="tel" id="phone" name="phone">

            <label for="SMS">May we text you?</label>
            <select id="SMS" name="SMS" required>
                <option value="" disabled selected>Please select</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>

            <fieldset>
                <legend>Message Purpose</legend>

                <input type="radio" id="inquiry" name="purpose" value="General Inquiry" required>
                <label for="inquiry">General Inquiry</label>

                <input type="radio" id="reservation" name="purpose" value="Reservation Question">
                <label for="reservation">Reservation Question</label>

                <input type="radio" id="suggestion" name="purpose" value="Website Suggestion">
                <label for="suggestion">Website Suggestion</label>
            </fieldset>

            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>

            <label for="newsletter"><input type="checkbox" id="newsletter" name="newsletter"
                  value="Yes"> Please subscribe me to the monthly newsletter.</label>


            <button type="submit">Send Us a Message!</button>
        </form>

        <section class="profile-panel">
            <h2>We Are Here to Serve You</h2>

            <div class="profile-grid">
                <figure class="profile-card">
                    <img class="avatar-img" src="images/malory_headshot.jpg"
                      alt="Employee Malory - Guide" width="300" height="300" />
                    <figcaption>Malory - Guide</figcaption>
                </figure>

                <figure class="profile-card">
                    <img class="avatar-img" src="images/carl_headshot.jpg"
                      alt="Employee Carl - Founder" width="300" height="300" />
                    <figcaption> Carl - Founder</figcaption>
                </figure>

                <figure class="profile-card">
                    <img class="avatar-img" src="images/deriek_headshot.jpg"
                      alt="Employee Deriek - Guide" width="300" height="300" />
                    <figcaption> Deriek - Guide</figcaption>
                </figure>
            </div>

        </section>

    </main>


    <footer>
        <p>&copy; 2026 Cascade Rapids Rafting Co. | David Christian Kay</p>
        <nav class="socialmedia">
            <a href="#">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="#">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="#">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
